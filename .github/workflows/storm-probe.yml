name: Storm probe
on:
  push:
    branches: [storm-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python probe/fixtures.py
      - name: Commit output
        run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan storm-fixtures
          git rm -rf --cached . >/dev/null
          git add -f fx
          git commit -m "fixtures" -q
          git push -f origin storm-fixtures
